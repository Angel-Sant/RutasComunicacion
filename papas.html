<style>
:root{--azul:#1f5fa9;--tinta:#1c2430;--suave:#5d6875;--linea:#dde3ea;--ok:#1d7a4c;--no:#b02525;--amb:#b5730c;--fondo:#f2f5f8;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fondo);
     color:var(--tinta);font-size:17px;line-height:1.4;padding-bottom:40px;}
.oculto{display:none !important;}
header{background:var(--azul);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;}
header .t{font-size:14px;opacity:.85;}
header .r{font-size:21px;font-weight:700;}
.wrap{padding:16px;max-width:520px;margin:0 auto;}
.tarjeta{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
h2{font-size:20px;margin:0 0 10px;}
label{display:block;font-size:15px;color:var(--suave);margin-bottom:6px;}
input{width:100%;padding:16px;font-size:20px;border:2px solid var(--linea);border-radius:12px;font-family:inherit;
      text-transform:uppercase;letter-spacing:1px;}
input:focus{outline:none;border-color:var(--azul);}
button{width:100%;padding:17px;font-size:19px;font-weight:700;border:none;border-radius:14px;color:#fff;
       background:var(--azul);margin-top:12px;font-family:inherit;cursor:pointer;}
button.gris{background:#7b8794;} button.chico{padding:12px;font-size:15px;font-weight:600;}
button.linea{background:#fff;color:var(--azul);border:2px solid var(--azul);}
.meta{font-size:15px;color:var(--suave);margin:4px 0;}
.hijo{border:2px solid var(--linea);border-radius:14px;padding:16px;margin-bottom:14px;background:#fff;}
.hijo .nm{font-size:22px;font-weight:800;line-height:1.15;}
.hijo .gr{font-size:14px;color:var(--suave);margin-bottom:10px;}
.hijo.si{border-color:var(--ok);}
.hijo.no{border-color:var(--no);}
.estado{font-size:19px;font-weight:700;margin:8px 0 4px;}
.estado.si{color:var(--ok);} .estado.no{color:var(--no);} .estado.esp{color:var(--amb);}
.linea-dato{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--linea);font-size:15px;}
.linea-dato:last-child{border:none;}
.linea-dato span:first-child{color:var(--suave);}
.chip{display:inline-block;background:#eaf1f9;color:var(--azul);font-size:13px;font-weight:600;padding:3px 9px;border-radius:11px;margin-bottom:8px;}
.aviso{background:#fff8e8;border-left:4px solid var(--amb);padding:12px 14px;border-radius:0 10px 10px 0;font-size:15px;margin:12px 0;}
.aviso.ok{background:#f2fbf6;border-left-color:var(--ok);}
.pie{text-align:center;font-size:13px;color:var(--suave);padding:18px;}
.err{color:var(--no);font-weight:600;margin-top:10px;}
.acc{display:flex;gap:8px;margin-top:12px;}
.acc button{margin-top:0;padding:13px 6px;font-size:15px;border-radius:10px;}
.opc{display:block;width:100%;text-align:left;background:#eef2f7;color:var(--tinta);font-weight:600;
     padding:14px;border-radius:10px;margin-top:8px;font-size:16px;border:2px solid transparent;cursor:pointer;font-family:inherit;}
.opc.sel{border-color:var(--azul);background:#fff;}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:11px;margin-top:8px;}
.badge.pend{background:#fdf0dc;color:var(--amb);}
.badge.baja{background:#fae3e3;color:var(--no);}
.badge.ok{background:#dff3e8;color:var(--ok);}
</style>

<body>

<header>
  <div class="t" id="hdSub">Colegio Bilbao</div>
  <div class="r" id="hdTit">Transporte</div>
</header>

<section id="pCarga" class="wrap">
  <div class="tarjeta"><h2>Un momento…</h2><p class="meta" id="cargaMsg">Conectando.</p></div>
</section>

<section id="pCodigo" class="wrap oculto">
  <div class="tarjeta">
    <h2>Escriba su código</h2>
    <label>Es el que le envió el colegio, por ejemplo BIL-4K7M-92XP</label>
    <input id="codigo" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="BIL-....-....">
    <button id="btnEntrar">ENTRAR</button>
    <p class="err oculto" id="errCod"></p>
    <p class="meta" style="font-size:13px;margin-top:14px">Solo se escribe una vez. Después su celular lo recuerda.</p>
  </div>
</section>

<section id="pAccion" class="wrap oculto">
  <div class="tarjeta">
    <h2 id="acTitulo">Acción</h2>
    <p class="meta" id="acAlumno"></p>
    <div id="acCuerpo"></div>
    <button class="gris chico" id="acCancelar">Cancelar</button>
  </div>
</section>

<section id="pPanel" class="wrap oculto">
  <div id="avisoDia"></div>
  <div id="hijos"></div>
  <div id="avisos"></div>
  <div id="acciones"></div>
  <div id="contacto"></div>
  <div class="tarjeta">
    <p class="meta" id="pieInfo"></p>
    <button class="linea chico" id="btnActualizar">ACTUALIZAR</button>
    <button class="gris chico" id="btnSalir">Salir de esta cuenta</button>
  </div>
  <div class="pie">Los horarios los registra la auxiliar durante el recorrido.</div>
</section>

<script>
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyAB17etP2RcTdgUGN0SPVxASsdKqomS2zU",
  authDomain: "rutas-bilbao.firebaseapp.com",
  databaseURL: "https://rutas-bilbao-default-rtdb.firebaseio.com",
  projectId: "rutas-bilbao",
  storageBucket: "rutas-bilbao.firebasestorage.app",
  messagingSenderId: "1024214893395",
  appId: "1:1024214893395:web:8873b37286630b4c2fd7a6"
};

var db=null, codigoActual=null, desuscribir=null;

/* ===================== AVISOS (OneSignal) =====================
   Su service worker va en la carpeta /push/ para no estorbar al sw.js
   que hace instalable la app. */
var ONESIGNAL_APP_ID="a241db7b-46ad-4cd1-a115-469ed627890f";
var avisosListos=false, avisosError="";

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal){
  try{
    await OneSignal.init({
      appId: ONESIGNAL_APP_ID,
      serviceWorkerPath: "RutasComunicacion/push/OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/RutasComunicacion/push/" },
      autoResubscribe: true,
      promptOptions: { slidedown: { enabled: false } }   /* lo pedimos nosotros, no al entrar */
    });
    avisosListos=true;
    /* si el permiso ya estaba dado de antes, se suscribe solo */
    if(permisoDado() && !avisosActivos()) pedirAvisos();
    if(codigoActual) vincularAvisos(codigoActual);
    pintarAvisos();
  }catch(e){
    /* sin avisos la app sigue funcionando, pero dejamos ver el motivo */
    avisosError=(e && (e.message||e.toString())) || "no se pudo iniciar";
    pintarAvisos();
  }
});

/* liga este celular con el código de la familia, para que el aviso
   de una ruta solo le llegue a quien le toca */
function vincularAvisos(cod){
  if(!avisosListos || !cod) return;
  OneSignalDeferred.push(async function(OneSignal){
    try{ await OneSignal.login(cod); }catch(e){}
    pintarAvisos();
  });
}

/* Tener el permiso de Chrome no basta: lo que cuenta es estar suscrito
   en OneSignal, que es distinto y puede faltar aunque el permiso ya esté dado. */
function avisosActivos(){
  try{
    var ps=window.OneSignal && OneSignal.User && OneSignal.User.PushSubscription;
    return !!(ps && ps.optedIn && ps.id);
  }catch(e){ return false; }
}
function permisoDado(){
  try{ return !!(window.OneSignal && OneSignal.Notifications && OneSignal.Notifications.permission); }
  catch(e){ return false; }
}

function pedirAvisos(){
  OneSignalDeferred.push(async function(OneSignal){
    try{
      if(!permisoDado()) await OneSignal.Notifications.requestPermission();
      /* con el permiso ya dado, hay que suscribir explícitamente */
      if(OneSignal.User.PushSubscription && !OneSignal.User.PushSubscription.optedIn){
        await OneSignal.User.PushSubscription.optIn();
      }
      if(codigoActual) await OneSignal.login(codigoActual);
      avisosError="";
    }catch(e){ avisosError=(e && (e.message||e.toString())) || "no se pudo activar"; }
    pintarAvisos();
  });
}

/* tarjeta para activar los avisos, solo si aún no los tiene */
function pintarAvisos(){
  var cont=document.getElementById("avisos");
  if(!cont) return;
  if(avisosActivos()){ cont.innerHTML=""; cont.dataset.puesto="0"; return; }
  if(!avisosListos && !avisosError){ cont.innerHTML=""; cont.dataset.puesto="0"; return; }
  if(cont.dataset.puesto==="1") return;
  cont.dataset.puesto="1";
  cont.innerHTML="";
  var d=document.createElement("div");
  d.className="tarjeta";
  d.innerHTML='<h2 style="font-size:18px">Active los avisos</h2>'+
    '<p class="meta" style="font-size:14px">'+
    (permisoDado()
      ? "Su celular ya tiene el permiso, solo falta activarlos para esta app."
      : "Para que le avisemos cuando la ruta salga y cuando su hijo sea el siguiente.")+'</p>';
  var b=document.createElement("button");
  b.textContent="ACTIVAR AVISOS";
  b.addEventListener("click", function(){ cont.dataset.puesto="0"; pedirAvisos(); });
  d.appendChild(b);
  var n=document.createElement("p");
  n.className="meta";
  n.style.cssText="font-size:12.5px;margin-top:10px";
  n.textContent="En iPhone primero agregue la app a la pantalla de inicio, o los avisos no llegan.";
  d.appendChild(n);
  if(avisosError){
    var er=document.createElement("p");
    er.className="err";
    er.style.cssText="font-size:12px;margin-top:8px";
    er.textContent="Detalle técnico: "+avisosError;
    d.appendChild(er);
  }
  cont.appendChild(d);
}

function $(id){ return document.getElementById(id); }
function ver(id){
  ["pCarga","pCodigo","pAccion","pPanel"].forEach(function(p){ $(p).classList.add("oculto"); });
  $(id).classList.remove("oculto"); window.scrollTo(0,0);
}
function hoy(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hora(ts){
  if(!ts) return "—";
  var d=new Date(ts),h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0");
  var ap=h<12?"a.m.":"p.m.",h12=h%12; if(h12===0)h12=12;
  return h12+":"+m+" "+ap;
}
function minutos(a,b){ return Math.max(0, Math.round((b-a)/60000)); }


/* ================= ACCIONES DE LOS PAPÁS ================= */
var DATOS_COLEGIO=null, MIS_ALUMNOS=[], MI_CONTACTO=null;
function telBonito(t){ return t.slice(0,2)+" "+t.slice(2,6)+" "+t.slice(6); }

/* Coordinación de transporte. Las llamadas se reparten: a cada familia le toca
   siempre el mismo coordinador, según su código. El correo llega a los dos. */
var COORDINADORES=[
  { nombre:"Miguel Santana", tel:"5562550283", correo:"miguel.santana.mon@bilbao.edu.mx" },
  { nombre:"Estela Garduño", tel:"5614307659", correo:"egardunoh@bilbao.edu.mx" }
];
function coordinadorDe(codigo){
  /* mezcla FNV-1a: reparte parejo aunque los códigos se parezcan entre sí */
  var s=2166136261, c=(codigo||"");
  for(var i=0;i<c.length;i++){ s^=c.charCodeAt(i); s=Math.imul(s,16777619); }
  return COORDINADORES[(s>>>0) % COORDINADORES.length];
}
/* Los dos coordinadores se muestran siempre; solo cambia el orden según la
   familia, para que la carga de llamadas quede repartida sin quitar la opción. */
function coordinadoresOrdenados(codigo){
  var primero=coordinadorDe(codigo);
  return [primero].concat(COORDINADORES.filter(function(c){ return c!==primero; }));
}
var LIMITE_TARDE="13:30";   /* después de esta hora ya no se puede avisar por la app */
var MOTIVOS_BAJA=["Lo recojo yo","Enfermo","Cita médica","Actividad extraescolar","Se va con un familiar","Otro"];

function antesDelLimite(){
  var p=LIMITE_TARDE.split(":"), d=new Date();
  return (d.getHours()*60+d.getMinutes()) < (parseInt(p[0],10)*60+parseInt(p[1],10));
}
function verificado(){
  try{ return localStorage.getItem("tb_verificado_"+codigoActual)==="1"; }catch(e){ return false; }
}
function pedirVerificacion(despues){
  var cont=$("acCuerpo");
  cont.innerHTML='<label style="margin-top:10px">Por seguridad, escriba los últimos 4 dígitos del teléfono donde recibió este código</label>'+
    '<input id="acDig" inputmode="numeric" maxlength="4" placeholder="0000" style="letter-spacing:6px;text-align:center">'+
    '<p class="err oculto" id="acErrDig">No coinciden. Si cambió de teléfono, pida un código nuevo al colegio.</p>';
  var b=document.createElement("button");
  b.textContent="CONTINUAR";
  b.addEventListener("click", function(){
    var d=($("acDig").value||"").replace(/\D/g,"");
    var tel=(MI_CONTACTO&&MI_CONTACTO.tel)||"";
    if(d.length===4 && tel.slice(-4)===d){
      try{ localStorage.setItem("tb_verificado_"+codigoActual,"1"); }catch(e){}
      despues();
    } else {
      $("acErrDig").classList.remove("oculto");
    }
  });
  cont.appendChild(b);
}

/* ---- hoy no sube (solo tarde) ---- */
function accionNoSube(al){
  $("acTitulo").textContent="Hoy no regresa en el transporte";
  $("acAlumno").textContent=al.nombre+" · solo aplica a la salida del colegio";
  ver("pAccion");
  function form(){
    var cont=$("acCuerpo");
    cont.innerHTML='<p class="meta">¿Por qué motivo?</p>';
    var elegido="";
    MOTIVOS_BAJA.forEach(function(m){
      var b=document.createElement("button");
      b.className="opc"; b.textContent=m;
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(cont.querySelectorAll(".opc"), function(x){ x.classList.remove("sel"); });
        b.classList.add("sel"); elegido=m;
      });
      cont.appendChild(b);
    });
    var conf=document.createElement("button");
    conf.style.marginTop="18px"; conf.style.background="var(--no)";
    conf.textContent="CONFIRMAR QUE HOY NO REGRESA";
    conf.addEventListener("click", function(){
      if(!elegido){ alert("Elija un motivo."); return; }
      conf.disabled=true; conf.textContent="Registrando…";
      var id=hoy()+"_"+al.id;
      db.collection("bajas").doc(id).set({
        fecha:hoy(), turno:"tarde", alumnoId:al.id, alumnoNombre:al.nombre,
        codigo:codigoActual, contacto:(MI_CONTACTO&&MI_CONTACTO.nombre)||"", 
        tel:(MI_CONTACTO&&MI_CONTACTO.tel)||"", motivo:elegido, ts:Date.now()
      }).then(function(){
        alert("Registrado a las "+hora(Date.now())+".\n\nLa auxiliar de la ruta ya lo ve en su lista.");
        ver("pPanel"); cargarExtras();
      }).catch(function(){
        conf.disabled=false; conf.textContent="CONFIRMAR QUE HOY NO REGRESA";
        alert("No se pudo registrar: revise su internet.\n\nSi ya es tarde, por favor avísenos por teléfono.");
        contactarCoordinacion("No pude registrar en la app que "+al.nombre+" hoy no regresa en el transporte.");
      });
    });
    cont.appendChild(conf);
  }
  if(verificado()) form(); else pedirVerificacion(form);
}

function deshacerBaja(al){
  if(!confirm(al.nombre+" sí regresará hoy en el transporte. ¿Confirmar?")) return;
  db.collection("bajas").doc(hoy()+"_"+al.id).delete().catch(function(){
    /* los papás no pueden borrar: se marca como cancelada */
    return db.collection("bajas").doc(hoy()+"_"+al.id).set({cancelada:true, ts:Date.now()},{merge:true});
  }).then(function(){ cargarExtras(); });
}

/* ---- solicitudes ---- */
function correoA(asunto, cuerpo){
  var para=COORDINADORES.map(function(x){ return x.correo; }).join(",");
  var nombres=MIS_ALUMNOS.map(function(a){ return a.nombre; }).join(" y ");
  var pie="\n\n---\nEnviado desde la app de transporte\nContacto: "+
          ((MI_CONTACTO&&MI_CONTACTO.nombre)||"")+"\nCódigo: "+codigoActual+
          (nombres?"\nAlumno(s): "+nombres:"");
  window.location.href="mailto:"+para+"?subject="+encodeURIComponent(asunto)+
    "&body="+encodeURIComponent(cuerpo+pie);
}

/* Contacto con coordinación: llamada o correo. No se usa WhatsApp. */
function contactarCoordinacion(texto){
  var vieja=document.getElementById("capaWhats");
  if(vieja) vieja.remove();
  var capa=document.createElement("div");
  capa.id="capaWhats";
  capa.style.cssText="position:fixed;inset:0;background:rgba(28,36,48,.6);z-index:200;display:flex;"+
    "align-items:flex-end;justify-content:center;padding:16px";
  var caja=document.createElement("div");
  caja.style.cssText="background:#fff;border-radius:16px;padding:20px;width:100%;max-width:460px";
  caja.innerHTML='<h2 style="margin:0 0 6px">Contacte a coordinación</h2>'+
    '<p class="meta" style="margin-bottom:6px">'+texto+'</p>';
  coordinadoresOrdenados(codigoActual).forEach(function(co){
    var bl=document.createElement("button");
    bl.innerHTML="LLAMAR A "+co.nombre.toUpperCase()+
                 "<br><span style='font-size:13px;font-weight:600;opacity:.9'>"+telBonito(co.tel)+"</span>";
    bl.addEventListener("click", function(){ capa.remove(); window.location.href="tel:+52"+co.tel; });
    caja.appendChild(bl);
  });
  var bc=document.createElement("button");
  bc.className="linea";
  bc.innerHTML="ENVIAR UN CORREO<br><span style='font-size:13px;font-weight:600'>Llega a los dos coordinadores</span>";
  bc.addEventListener("click", function(){
    capa.remove();
    correoA("Transporte — mensaje de un papá", texto);
  });
  caja.appendChild(bc);
  var bc=document.createElement("button");
  bc.className="gris chico"; bc.textContent="Cancelar";
  bc.addEventListener("click", function(){ capa.remove(); });
  caja.appendChild(bc);
  capa.appendChild(caja);
  capa.addEventListener("click", function(e){ if(e.target===capa) capa.remove(); });
  document.body.appendChild(capa);
}
function cupoDe(rutaNum, turno){
  if(!DATOS_COLEGIO || !DATOS_COLEGIO.rutas) return null;
  var r=DATOS_COLEGIO.rutas[rutaNum];
  if(!r) return null;
  var libres=(turno==="am") ? r.libresAM : r.libresPM;
  return { cupo:r.cupo||0, libres:(libres||0), ocupados:(r.cupo||0)-(libres||0) };
}

function accionCambio(al){
  $("acTitulo").textContent="Pedir un cambio";
  $("acAlumno").textContent=al.nombre;
  ver("pAccion");
  var cont=$("acCuerpo");
  cont.innerHTML="";
  [["ruta","Cambiar de ruta"],["entrega","Cambiar el lugar de entrega"]].forEach(function(o){
    var b=document.createElement("button");
    b.className="opc"; b.textContent=o[1];
    b.addEventListener("click", function(){ o[0]==="ruta" ? formRuta(al) : formEntrega(al); });
    cont.appendChild(b);
  });
  var nota=document.createElement("p");
  nota.className="meta"; nota.style.marginTop="14px";
  nota.textContent="Los cambios de ruta y de dirección los revisa y aprueba coordinación antes de aplicarse.";
  cont.appendChild(nota);
}

function formRuta(al){
  var cont=$("acCuerpo");
  cont.innerHTML='<p class="meta">¿A qué ruta?</p>';
  var elegida="";
  Object.keys(DATOS_COLEGIO.rutas).sort().forEach(function(k){
    var c=cupoDe(k,"pm");
    var b=document.createElement("button");
    b.className="opc";
    b.innerHTML="<b>Ruta "+k+"</b><br><span style='font-size:13px;color:var(--suave)'>"+
      (c.libres>0 ? c.libres+" lugar(es) disponible(s)" : "Sin lugares disponibles")+"</span>";
    if(c.libres<=0){
      b.style.opacity=".55";
      b.addEventListener("click", function(){
        alert("La Ruta "+k+" no tiene lugares disponibles.\n\nComuníquese con coordinación para revisar su caso.");
        contactarCoordinacion("Buen día. Quisiera cambiar a "+al.nombre+" a la Ruta "+k+", pero la app indica que no hay lugares. ¿Me pueden apoyar?");
      });
    } else {
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(cont.querySelectorAll(".opc"), function(x){ x.classList.remove("sel"); });
        b.classList.add("sel"); elegida=k;
      });
    }
    cont.appendChild(b);
  });
  var mot=document.createElement("input");
  mot.id="acMotivo"; mot.placeholder="Motivo (opcional)";
  mot.style.cssText="text-transform:none;letter-spacing:0;margin-top:14px;font-size:16px;padding:13px";
  cont.appendChild(mot);
  var env=document.createElement("button");
  env.textContent="ENVIAR SOLICITUD";
  env.addEventListener("click", function(){
    if(!elegida){ alert("Elija una ruta con lugares disponibles."); return; }
    enviarSolicitud(al,{ tipo:"ruta", rutaDestino:elegida, motivo:mot.value.trim() }, env);
  });
  cont.appendChild(env);
}

function formEntrega(al){
  var cont=$("acCuerpo");
  cont.innerHTML='<p class="meta">Escriba la dirección donde debe entregarse. Coordinación la revisa antes de aplicarla.</p>'+
    '<input id="acDir" placeholder="Calle, número y colonia" style="text-transform:none;letter-spacing:0;font-size:16px;padding:13px">'+
    '<input id="acRef" placeholder="Referencia (portón, color de casa)" style="text-transform:none;letter-spacing:0;font-size:16px;padding:13px;margin-top:10px">'+
    '<p class="meta" style="font-size:13px;margin-top:10px">¿Es solo por un día o permanente? Indíquelo en el motivo.</p>'+
    '<input id="acMotivo" placeholder="Motivo" style="text-transform:none;letter-spacing:0;font-size:16px;padding:13px;margin-top:6px">';
  var env=document.createElement("button");
  env.textContent="ENVIAR SOLICITUD";
  env.addEventListener("click", function(){
    var d=$("acDir").value.trim();
    if(d.length<8){ alert("Escriba la dirección completa."); return; }
    enviarSolicitud(al,{ tipo:"entrega", dir:d, ref:$("acRef").value.trim(), motivo:$("acMotivo").value.trim() }, env);
  });
  $("acCuerpo").appendChild(env);
}

function enviarSolicitud(al, datos, boton){
  function mandar(){
    boton.disabled=true; boton.textContent="Enviando…";
    var doc=db.collection("solicitudes").doc();
    var reg=Object.assign({
      fecha:hoy(), alumnoId:al.id, alumnoNombre:al.nombre, codigo:codigoActual,
      contacto:(MI_CONTACTO&&MI_CONTACTO.nombre)||"", tel:(MI_CONTACTO&&MI_CONTACTO.tel)||"",
      estado:"pendiente", ts:Date.now()
    }, datos);
    doc.set(reg).then(function(){
      try{
        var mias=JSON.parse(localStorage.getItem("tb_solicitudes")||"[]");
        mias.push(doc.id);
        localStorage.setItem("tb_solicitudes", JSON.stringify(mias.slice(-20)));
      }catch(e){}
      alert("Solicitud enviada a las "+hora(Date.now())+".\n\nCoordinación la revisará y usted verá aquí la respuesta. Mientras tanto, el servicio sigue como está hoy.");
      ver("pPanel"); cargarExtras();
    }).catch(function(){
      boton.disabled=false; boton.textContent="ENVIAR SOLICITUD";
      alert("No se pudo enviar. Contacte a coordinación.");
      contactarCoordinacion("Buen día. Quisiera solicitar un cambio para "+al.nombre+".");
    });
  }
  if(verificado()) mandar(); else pedirVerificacion(mandar);
}
$("acCancelar").addEventListener("click", function(){ ver("pPanel"); });

/* ---- lee bajas y solicitudes propias para pintarlas ---- */
var BAJAS_HOY={}, MIS_SOLICITUDES=[];
function cargarExtras(){
  BAJAS_HOY={};
  MIS_ALUMNOS.forEach(function(al){
    db.collection("bajas").doc(hoy()+"_"+al.id).get().then(function(s){
      if(s.exists && !s.data().cancelada) BAJAS_HOY[al.id]=s.data();
      else delete BAJAS_HOY[al.id];
      pintarAcciones();
    }).catch(function(){});
  });
  var ids=[];
  try{ ids=JSON.parse(localStorage.getItem("tb_solicitudes")||"[]"); }catch(e){}
  MIS_SOLICITUDES=[];
  ids.forEach(function(id){
    db.collection("solicitudes").doc(id).get().then(function(s){
      if(s.exists && s.data().codigo===codigoActual){ MIS_SOLICITUDES.push(Object.assign({id:id}, s.data())); pintarAcciones(); }
    }).catch(function(){});
  });
}

/* ---------- arranque ---------- */
firebase.initializeApp(FIREBASE_CONFIG);
db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(function(){});

firebase.auth().signInAnonymously().then(function(){
  var guardado=null;
  try{ guardado=localStorage.getItem("tb_codigo_familia"); }catch(e){}
  if(guardado) entrar(guardado, true);
  else ver("pCodigo");
}).catch(function(){
  $("cargaMsg").innerHTML="No se pudo conectar.<br>Revise su internet y vuelva a abrir la app.";
});

$("btnEntrar").addEventListener("click", function(){
  var c=$("codigo").value.trim().toUpperCase().replace(/\s+/g,"");
  if(c && c.indexOf("BIL")!==0) c="BIL-"+c;
  if(c.length<8){ $("errCod").textContent="El código está incompleto."; $("errCod").classList.remove("oculto"); return; }
  entrar(c, false);
});
$("codigo").addEventListener("keydown", function(e){ if(e.key==="Enter") $("btnEntrar").click(); });

function entrar(cod, silencioso){
  $("errCod").classList.add("oculto");
  $("cargaMsg").textContent="Buscando su información…";
  ver("pCarga");
  codigoActual=cod;
  escuchar(cod, silencioso);
}

/* La app de papás ya no lee el padrón completo (las reglas no lo permiten,
   y con razón: ahí están los datos de todos los alumnos).
   Coordinación le publica a cada familia un documento con solo lo suyo. */
/* Por qué no se pudieron cargar los datos. Sirve para que el aviso
   diga algo útil en vez de dejar a todos adivinando. */
var MOTIVO_SIN_DATOS = "";

function cargarColegio(cod){
  MOTIVO_SIN_DATOS = "";
  return db.collection("familias").doc(cod).collection("datos").doc("perfil").get()
    .then(function(s){
      if(!s.exists){
        DATOS_COLEGIO=null;
        MOTIVO_SIN_DATOS="no-existe";
        return;
      }
      var p=s.data();
      DATOS_COLEGIO=p;
      MIS_ALUMNOS=(p.hijos||[]).map(function(x){
        return { id:x.id, nombre:x.nombre, seccion:x.seccion, grado:x.grado,
                 ruta:x.rutaPM||x.rutaAM, rutaAM:x.rutaAM, rutaPM:x.rutaPM,
                 am:x.am!==false, pm:x.pm!==false };
      });
      MI_CONTACTO=p.contacto||null;
      if(p.colegio && p.colegio.nombre) $("hdSub").textContent=p.colegio.nombre;
      if(p.coordinadores && p.coordinadores.length) COORDINADORES=p.coordinadores;
    })
    .catch(function(e){
      DATOS_COLEGIO=null;
      MOTIVO_SIN_DATOS=(e && (e.code || e.message)) || "error";
    });
}

function escuchar(cod, silencioso){
  if(desuscribir) desuscribir();
  var primera=true;
  desuscribir=db.collection("familias").doc(cod).collection("dias")
    .where("fecha","==",hoy())
    .onSnapshot(function(qs){
      var docs=[];
      qs.forEach(function(d){ docs.push(d.data()); });
      if(primera){
        primera=false;
        try{ localStorage.setItem("tb_codigo_familia", cod); }catch(e){}
        registrarAcceso(cod);
        vincularAvisos(cod);
        pintarAvisos();
        ver("pPanel");
        cargarColegio(cod).then(function(){ pintarAcciones(); pintarContacto(); cargarExtras(); });
      }
      pintar(docs);
    }, function(){
      if(silencioso){ ver("pPanel"); pintar([]); }
      else {
        ver("pCodigo");
        $("errCod").textContent="No pudimos validar ese código. Revíselo o pida uno nuevo al colegio.";
        $("errCod").classList.remove("oculto");
      }
    });
}


/* deja constancia de que esta familia ya usa la app,
   para que coordinación sepa a quién le falta instalarla */
function registrarAcceso(cod){
  try{
    db.collection("familias").doc(cod).collection("acceso").doc("ultimo").set({
      ts:Date.now(),
      dispositivo:(navigator.userAgent||"").slice(0,120)
    },{merge:true}).catch(function(){});
  }catch(e){}
}

function pintarContacto(){
  var cont=$("contacto");
  if(!cont || cont.dataset.listo==="1") return;
  cont.dataset.listo="1";
  var nombres=MIS_ALUMNOS.map(function(a){ return a.nombre; }).join(" y ");

  var d=document.createElement("div");
  d.className="tarjeta";
  d.innerHTML='<h2 style="font-size:18px">¿Necesita hablar con nosotros?</h2>'+
    '<p class="meta" style="font-size:14px">Puede llamar a cualquiera de los dos coordinadores de transporte.</p>';

  coordinadoresOrdenados(codigoActual).forEach(function(co){
    var bl=document.createElement("button");
    bl.className="linea";
    bl.innerHTML="LLAMAR A "+co.nombre.toUpperCase()+
                 "<br><span style='font-size:13px;font-weight:600'>"+telBonito(co.tel)+"</span>";
    bl.addEventListener("click", function(){ window.location.href="tel:+52"+co.tel; });
    d.appendChild(bl);
  });

  var bc=document.createElement("button");
  bc.className="linea";
  bc.innerHTML="ENVIAR UN CORREO<br><span style='font-size:13px;font-weight:600'>Llega a los dos coordinadores</span>";
  bc.addEventListener("click", function(){
    correoA("Transporte — "+(nombres||"consulta"),
            "Buen día.\n\nLes escribo sobre el transporte de "+(nombres||"mi hijo")+".\n\n[Escriba aquí su mensaje]");
  });
  d.appendChild(bc);

  var nota=document.createElement("p");
  nota.className="meta";
  nota.style.cssText="font-size:12.5px;margin-top:12px";
  nota.textContent="Si la ruta ya va en camino y es urgente, es mejor llamar que escribir.";
  d.appendChild(nota);

  cont.appendChild(d);
}

function pintarAcciones(){
  var cont=$("acciones");
  if(!cont) return;
  cont.innerHTML="";
  if(!MIS_ALUMNOS.length){
    if(DATOS_COLEGIO===null){
      var av=document.createElement("div");
      av.className="tarjeta";
      var pista = "";
      if(MOTIVO_SIN_DATOS==="permission-denied")
        pista='<br><span style="font-size:12px;opacity:.8">Las reglas de Firebase no permiten leer este documento '+
              '(permission-denied). Hay que publicar las reglas actualizadas.</span>';
      else if(MOTIVO_SIN_DATOS==="no-existe")
        pista='<br><span style="font-size:12px;opacity:.8">No hay perfil publicado para el código '+
              (codigoActual||"")+'. Coordinación debe usar "Volver a publicar todos los perfiles".</span>';
      else if(MOTIVO_SIN_DATOS)
        pista='<br><span style="font-size:12px;opacity:.8">Detalle técnico: '+MOTIVO_SIN_DATOS+'</span>';
      av.innerHTML='<div class="aviso">Todavía no podemos mostrar las opciones de su familia.<br>'+
        'Si acaba de recibir su código, inténtelo más tarde o avísenos.'+pista+'</div>';
      cont.appendChild(av);
    }
    return;
  }

  MIS_ALUMNOS.forEach(function(al){
    var d=document.createElement("div");
    d.className="tarjeta";
    var baja=BAJAS_HOY[al.id];
    var sol=MIS_SOLICITUDES.filter(function(s){ return s.alumnoId===al.id; }).sort(function(a,b){ return b.ts-a.ts; })[0];

    var html='<h2 style="font-size:18px">'+al.nombre+'</h2>';
    if(baja) html+='<span class="badge baja">Hoy no regresa · '+baja.motivo+'</span>';
    if(sol){
      var t=(sol.tipo==="ruta") ? ("cambio a la Ruta "+sol.rutaDestino) : "cambio de lugar de entrega";
      if(sol.estado==="pendiente") html+='<br><span class="badge pend">Solicitud de '+t+' · en revisión</span>';
      else if(sol.estado==="aprobada") html+='<br><span class="badge ok">Solicitud aprobada: '+t+'</span>';
      else if(sol.estado==="rechazada") html+='<br><span class="badge baja">Solicitud no aprobada'+(sol.respuesta?": "+sol.respuesta:"")+'</span>';
    }
    d.innerHTML=html;

    var caja=document.createElement("div");
    caja.className="acc";
    if(al.pm!==false){
      var b1=document.createElement("button");
      if(baja){
        b1.className="linea"; b1.textContent="Sí regresa hoy";
        b1.addEventListener("click", function(){ deshacerBaja(al); });
      } else if(!antesDelLimite()){
        b1.className="gris"; b1.textContent="Ya pasó la hora";
        b1.addEventListener("click", function(){
          alert("Después de las "+LIMITE_TARDE+" ya no es posible avisar por la app.\n\nAvise a coordinación por teléfono o correo.");
          contactarCoordinacion("Buen día. Aviso que "+al.nombre+" hoy no regresa en el transporte.");
        });
      } else {
        b1.style.background="var(--no)"; b1.textContent="Hoy no regresa";
        b1.addEventListener("click", function(){ accionNoSube(al); });
      }
      caja.appendChild(b1);
    }
    var b2=document.createElement("button");
    b2.className="linea"; b2.textContent="Pedir un cambio";
    b2.addEventListener("click", function(){ accionCambio(al); });
    caja.appendChild(b2);
    d.appendChild(caja);

    if(al.pm!==false && antesDelLimite() && !baja){
      var nota=document.createElement("p");
      nota.className="meta"; nota.style.cssText="font-size:13px;margin-top:10px";
      nota.textContent="El aviso de no regresar aplica solo a la salida del colegio, hasta las "+LIMITE_TARDE+".";
      d.appendChild(nota);
    }
    cont.appendChild(d);
  });
}

function pintar(docs){
  var cont=$("hijos"); cont.innerHTML="";
  $("hdTit").textContent="Transporte";
  $("hdSub").textContent="Colegio Bilbao";

  if(!docs.length){
    $("avisoDia").innerHTML='<div class="aviso">Todavía no hay movimiento hoy.<br>' +
      'Aquí aparecerá el recorrido de sus hijos en cuanto la ruta comience.</div>';
    $("pieInfo").textContent="Código "+codigoActual;
    return;
  }
  $("avisoDia").innerHTML="";

  /* un documento por alumno y turno; se ignora cualquier otro */
  docs=docs.filter(function(d){ return d && d.alumno && d.alumno.id; });
  if(!docs.length){
    $("avisoDia").innerHTML='<div class="aviso">Todavía no hay movimiento hoy.<br>'+
      'Aquí aparecerá el recorrido de sus hijos en cuanto la ruta comience.</div>';
    $("pieInfo").textContent="Código "+codigoActual;
    return;
  }
  var porAlumno={};
  docs.forEach(function(d){
    var k=d.alumno.id+"_"+d.turno;
    if(!porAlumno[k] || d.actualizado>porAlumno[k].actualizado) porAlumno[k]=d;
  });

  Object.keys(porAlumno).sort().forEach(function(k){
    var d=porAlumno[k], a=d.alumno, esAM=(d.turno==="manana");
    var div=document.createElement("div");
    div.className="hijo"+(a.estado==="si"?" si":(a.estado==="no"?" no":""));

    var html='<span class="chip">Ruta '+d.ruta+' · '+(esAM?"Camino al colegio":"Camino a casa")+'</span>'+
             '<div class="nm">'+a.nombre+'</div>'+
             '<div class="gr">Parada '+a.parada+' de '+d.totalParadas+(a.punto?" · "+a.punto:"")+'</div>';

    if(a.estado==="si"){
      html+='<div class="estado si">'+(esAM?"Abordó a las "+hora(a.hora):"Entregado a las "+hora(a.hora))+'</div>';
    } else if(a.estado==="no"){
      html+='<div class="estado no">'+(esAM?"No abordó":"No se entregó")+(a.motivoNo?" · "+a.motivoNo:"")+'</div>';
    } else {
      html+='<div class="estado esp">'+(esAM?"Aún no aborda":"Aún no se entrega")+'</div>';
    }

    html+='<div style="margin-top:10px">';
    if(d.inicio) html+='<div class="linea-dato"><span>'+(esAM?"La ruta salió":"Salió del colegio")+'</span><span>'+hora(d.inicio)+'</span></div>';
    if(a.estado==="si"&&a.hora) html+='<div class="linea-dato"><span>'+(esAM?"Abordó":"Bajó")+'</span><span>'+hora(a.hora)+'</span></div>';
    if(d.fin){
      html+='<div class="linea-dato"><span>'+(esAM?"Llegó al colegio":"Terminó el recorrido")+'</span><span>'+hora(d.fin)+'</span></div>';
      if(a.estado==="si"&&a.hora&&esAM)
        html+='<div class="linea-dato"><span>Tiempo a bordo</span><span>'+minutos(a.hora,d.fin)+' min</span></div>';
    } else {
      html+='<div class="linea-dato"><span>Va en la parada</span><span>'+d.paradaActual+' de '+d.totalParadas+'</span></div>';
    }
    html+='</div>';

    /* dónde iba el camión la última vez que la auxiliar cerró una parada */
    if(!d.fin && d.camion && d.camion.lat){
      var minsCamion=Math.round((Date.now()-d.camion.ts)/60000);
      var cuando = minsCamion<1 ? "hace menos de un minuto"
                 : (minsCamion===1 ? "hace 1 minuto" : "hace "+minsCamion+" minutos");
      html+='<div class="aviso" style="margin-top:12px;border-left-color:var(--azul);background:#eef2f7">'+
            '<b>El camión pasó por aquí '+cuando+'</b>'+
            '<div style="margin-top:8px"><button class="linea chico" data-mapa="'+
            d.camion.lat+','+d.camion.lng+'" style="margin:0">VER EN GOOGLE MAPS</button></div></div>';
    }

    if(d.fin&&d.comentario) html+='<div class="aviso ok" style="margin-top:12px"><b>Comentario de la auxiliar:</b><br>'+d.comentario+'</div>';
    div.innerHTML=html;
    var bm=div.querySelector("[data-mapa]");
    if(bm){
      bm.addEventListener("click", function(){
        window.open("https://www.google.com/maps/search/?api=1&query="+bm.dataset.mapa,"_blank");
      });
    }
    cont.appendChild(div);
  });

  var ult=0;
  docs.forEach(function(d){ if(d.actualizado>ult) ult=d.actualizado; });
  $("pieInfo").textContent="Última actualización: "+hora(ult)+" · código "+codigoActual;
}

$("btnActualizar").addEventListener("click", function(){
  if(codigoActual) escuchar(codigoActual,true);
  if(avisosListos && !avisosActivos()) pedirAvisos();
  pintarAvisos();
});
$("btnSalir").addEventListener("click", function(){
  if(!confirm("Se borrará su código de este celular y tendrá que escribirlo otra vez. ¿Continuar?")) return;
  try{ localStorage.removeItem("tb_codigo_familia"); }catch(e){}
  location.reload();
});
</script>

<script>
/* ---------- app instalable ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.addEventListener("updatefound", function(){
        var nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener("statechange", function(){
          if(nuevo.state === "installed" && navigator.serviceWorker.controller) avisarVersion(reg);
        });
      });
    }).catch(function(){});
    var recargando = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(recargando) return;
      recargando = true;
      location.reload();
    });
  });
}
function avisarVersion(reg){
  if(document.getElementById("barraVersion")) return;
  var b = document.createElement("div");
  b.id = "barraVersion";
  b.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:300;background:#1c2430;color:#fff;"+
    "padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:15px";
  b.innerHTML = "<span>Hay una versión nueva de la app.</span>";
  var a = document.createElement("button");
  a.textContent = "ACTUALIZAR";
  a.style.cssText = "background:#1d7a4c;color:#fff;border:none;border-radius:9px;padding:11px 16px;"+
    "font-weight:700;font-size:15px;width:auto;margin:0;cursor:pointer";
  a.onclick = function(){
    if(reg.waiting) reg.waiting.postMessage("actualizar");
    else location.reload();
  };
  b.appendChild(a);
  document.body.appendChild(b);
}
</script>
